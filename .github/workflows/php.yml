name: PHP checks
on:
  push:
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,pdo_mysql,fileinfo,gd
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: find src public scripts -name '*.php' -print0 | xargs -0 -n1 php -l
